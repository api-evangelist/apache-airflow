naftiko: 1.0.0-alpha1
info:
  label: Apache Airflow REST API
  description: Shared per-API capability for the Apache Airflow stable REST API 
    covering DAGs, DAG Runs, Tasks, Connections, Variables, Pools, and Users.
  tags:
  - Apache Airflow
  - Workflow Orchestration
  - DAG Management
  - ETL
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AIRFLOW_USERNAME: AIRFLOW_USERNAME
    AIRFLOW_PASSWORD: AIRFLOW_PASSWORD
capability:
  consumes:
  - type: http
    namespace: airflow-rest
    baseUri: http://localhost:8080/api/v1
    description: Apache Airflow stable REST API.
    authentication:
      type: basic
      username: '{{AIRFLOW_USERNAME}}'
      password: '{{AIRFLOW_PASSWORD}}'
    resources:
    - name: dags
      path: /dags
      description: Manage DAG definitions.
      operations:
      - name: list-dags
        method: GET
        description: List all DAGs.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
        - name: offset
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-dag
        method: GET
        description: Get a specific DAG.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patch-dag
        method: PATCH
        description: Update a DAG (pause/unpause).
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: dag-runs
      path: /dags/{dag_id}/dagRuns
      description: Manage DAG runs.
      operations:
      - name: list-dag-runs
        method: GET
        description: List DAG runs for a DAG.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: trigger-dag-run
        method: POST
        description: Trigger a new DAG run.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-dag-run
        method: GET
        description: Get a specific DAG run.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        - name: dag_run_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: task-instances
      path: /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances
      description: Monitor task instances.
      operations:
      - name: list-task-instances
        method: GET
        description: List task instances for a DAG run.
        inputParameters:
        - name: dag_id
          in: path
          type: string
          required: true
        - name: dag_run_id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: connections
      path: /connections
      description: Manage Airflow connections.
      operations:
      - name: list-connections
        method: GET
        description: List all connections.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-connection
        method: POST
        description: Create a new connection.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: variables
      path: /variables
      description: Manage Airflow variables.
      operations:
      - name: list-variables
        method: GET
        description: List all variables.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-variable
        method: POST
        description: Create a new variable.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pools
      path: /pools
      description: Manage Airflow resource pools.
      operations:
      - name: list-pools
        method: GET
        description: List all pools.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8100
    namespace: airflow-rest-api
    resources:
    - path: /v1/dags
      name: dags
      operations:
      - method: GET
        name: list-dags
        description: List all DAGs.
        call: airflow-rest.list-dags
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/dag-runs
      name: dag-runs
      operations:
      - method: GET
        name: list-dag-runs
        description: List DAG runs.
        call: airflow-rest.list-dag-runs
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: trigger-dag-run
        description: Trigger a DAG run.
        call: airflow-rest.trigger-dag-run
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9100
    namespace: airflow-mcp
    transport: http
    tools:
    - name: list-dags
      description: List all Airflow DAGs.
      hints:
        readOnly: true
        openWorld: true
      call: airflow-rest.list-dags
      outputParameters:
      - type: object
        mapping: $.
    - name: get-dag
      description: Get details of a specific DAG.
      hints:
        readOnly: true
        openWorld: true
      call: airflow-rest.get-dag
      with:
        dag_id: tools.dag_id
      outputParameters:
      - type: object
        mapping: $.
    - name: trigger-dag-run
      description: Trigger an Airflow DAG run.
      hints:
        readOnly: false
        openWorld: false
      call: airflow-rest.trigger-dag-run
      with:
        dag_id: tools.dag_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-dag-runs
      description: List runs for an Airflow DAG.
      hints:
        readOnly: true
        openWorld: true
      call: airflow-rest.list-dag-runs
      with:
        dag_id: tools.dag_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-task-instances
      description: List task instances for a DAG run.
      hints:
        readOnly: true
        openWorld: true
      call: airflow-rest.list-task-instances
      with:
        dag_id: tools.dag_id
        dag_run_id: tools.dag_run_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-connections
      description: List Airflow connections.
      hints:
        readOnly: true
        openWorld: true
      call: airflow-rest.list-connections
      outputParameters:
      - type: object
        mapping: $.
    - name: list-variables
      description: List Airflow variables.
      hints:
        readOnly: true
        openWorld: true
      call: airflow-rest.list-variables
      outputParameters:
      - type: object
        mapping: $.
