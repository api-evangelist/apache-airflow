            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Forbidden
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-operation-id-source: normalized
      x-operation-id-original: patch_connection
  /api/v2/connections/enqueue-test:
    get:
      tags:
      - Connection
      summary: Get Connection Test
      description: Poll for the status of an enqueued connection test by its token (passed as a header).
      operationId: get_connection_test
      security:
      - OAuth2PasswordBearer: []
      - HTTPBearer: []
