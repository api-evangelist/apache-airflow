    delete:
      tags:
      - Task State Store
      summary: Delete Task State Store
      description: Delete a single task state store key. No-op if the key does not exist.
      operationId: delete_task_state_store
      security:
      - OAuth2PasswordBearer: []
      - HTTPBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: dag_id
        in: path
        required: true
        schema:
          type: string
          title: Dag Id
      - name: dag_run_id
        in: path
        required: true
