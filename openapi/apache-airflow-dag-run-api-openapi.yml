        in: path
        required: true
        schema:
          type: string
          title: Dag Id
      - name: partition_date_gte
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Inclusive lower bound of the partition_date window, interpreted as a local calendar day in the Dag's timetable timezone. Runs from the start of this day onwards match.
          title: Partition Date Gte
        description: Inclusive lower bound of the partition_date window, interpreted as a local calendar day in the Dag's timetable timezone. Runs from the start of this day onwards match.
      - name: partition_date_lte
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: 'Inclusive upper bound of the partition_date window, interpreted as a local calendar day in the Dag''s timetable timezone. The whole day is included: runs up to the end of this day match.'
          title: Partition Date Lte
        description: 'Inclusive upper bound of the partition_date window, interpreted as a local calendar day in the Dag''s timetable timezone. The whole day is included: runs up to the end of this day match.'
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor for keyset-based pagination. Pass an empty string for the first page, then use ``next_cursor`` from the response. When ``cursor`` is provided, ``offset`` is ignored.
          title: Cursor
        description: Cursor for keyset-based pagination. Pass an empty string for the first page, then use ``next_cursor`` from the response. When ``cursor`` is provided, ``offset`` is ignored.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 50
          title: Limit
      - name: offset
