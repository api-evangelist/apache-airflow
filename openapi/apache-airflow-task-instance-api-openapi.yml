openapi: 3.2.0
info:
  contact:
    email: dev@airflow.apache.org
    name: Apache Software Foundation
    url: https://airflow.apache.org
    x-twitter: TheASF
  description: '# Overview


    To facilitate management, Apache Airflow supports a range of REST API endpoints across its

    objects.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Airflow API (Stable) Task Instance API
  version: 2.5.3
  x-apisguru-categories:
  - messaging
  x-logo:
    url: https://twitter.com/TheASF/profile_image?size=original
  x-origin:
  - format: openapi
    url: https://airflow.apache.org/docs/apache-airflow/stable/_specs/v1.yaml
    version: '3.0'
  x-providerName: apache.org
  x-serviceName: airflow
servers:
- description: Apache Airflow Stable API.
  url: /api/v1
- url: https://apache.local
security: []
tags:
- name: Task Instance
paths:
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/FilterExecutionDateGTE'
    - $ref: '#/components/parameters/FilterExecutionDateLTE'
    - $ref: '#/components/parameters/FilterStartDateGTE'
    - $ref: '#/components/parameters/FilterStartDateLTE'
    - $ref: '#/components/parameters/FilterEndDateGTE'
    - $ref: '#/components/parameters/FilterEndDateLTE'
    - $ref: '#/components/parameters/FilterDurationGTE'
    - $ref: '#/components/parameters/FilterDurationLTE'
    - $ref: '#/components/parameters/FilterState'
    - $ref: '#/components/parameters/FilterPool'
    - $ref: '#/components/parameters/FilterQueue'
    get:
      description: This endpoint allows specifying `~` as the dag_id, dag_run_id to retrieve DAG runs for all DAGs and DAG runs.
      operationId: get_task_instances
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstanceCollection'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      summary: Apache Airflow List Task Instances
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    get:
      operationId: get_task_instance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Get a Task Instance
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
    patch:
      description: 'Updates the state for single task instance.

        *New in version 2.5.0*'
      operationId: patch_task_instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInstance'
        description: Parameters of action
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstanceReference'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Updates the State of a Task Instance
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}/links:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    get:
      description: List extra links for task instance.
      operationId: get_extra_links
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtraLinkCollection'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow List Extra Links
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.extra_link_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}/listMapped:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    get:
      description: 'Get details of all mapped task instances.


        *New in version 2.3.0*'
      operationId: get_mapped_task_instances
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      - $ref: '#/components/parameters/FilterExecutionDateGTE'
      - $ref: '#/components/parameters/FilterExecutionDateLTE'
      - $ref: '#/components/parameters/FilterStartDateGTE'
      - $ref: '#/components/parameters/FilterStartDateLTE'
      - $ref: '#/components/parameters/FilterEndDateGTE'
      - $ref: '#/components/parameters/FilterEndDateLTE'
      - $ref: '#/components/parameters/FilterDurationGTE'
      - $ref: '#/components/parameters/FilterDurationLTE'
      - $ref: '#/components/parameters/FilterState'
      - $ref: '#/components/parameters/FilterPool'
      - $ref: '#/components/parameters/FilterQueue'
      - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstanceCollection'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow List Mapped Task Instances
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}/logs/{task_try_number}:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    - $ref: '#/components/parameters/TaskTryNumber'
    - $ref: '#/components/parameters/FullContent'
    - $ref: '#/components/parameters/FilterMapIndex'
    - $ref: '#/components/parameters/ContinuationToken'
    get:
      description: Get logs for a specific task instance and its try number.
      operationId: get_log
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  content:
                    type: string
                  continuation_token:
                    type: string
                type: object
            text/plain:
              schema:
                type: string
          description: Success.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Get Logs
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.log_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}/setNote:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    patch:
      description: 'Update the manual user note of a non-mapped Task Instance.


        *New in version 2.5.0*'
      operationId: set_task_instance_note
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaskInstanceNote'
        description: Parameters of set Task Instance note.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
          description: Success.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Update the TaskInstance Note
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}/{map_index}:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    - $ref: '#/components/parameters/MapIndex'
    get:
      description: 'Get details of a mapped task instance.


        *New in version 2.3.0*'
      operationId: get_mapped_task_instance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Get a Mapped Task Instance
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
    patch:
      description: 'Updates the state for single mapped task instance.

        *New in version 2.5.0*'
      operationId: patch_mapped_task_instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInstance'
        description: Parameters of action
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstanceReference'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Updates the State of a Mapped Task Instance
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
  /dags/{dag_id}/dagRuns/{dag_run_id}/taskInstances/{task_id}/{map_index}/setNote:
    parameters:
    - $ref: '#/components/parameters/DAGID'
    - $ref: '#/components/parameters/DAGRunID'
    - $ref: '#/components/parameters/TaskID'
    - $ref: '#/components/parameters/MapIndex'
    patch:
      description: 'Update the manual user note of a mapped Task Instance.


        *New in version 2.5.0*'
      operationId: set_mapped_task_instance_note
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaskInstanceNote'
        description: Parameters of set Task Instance note.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'
          description: Success.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow Update the TaskInstance Note
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
  /dags/~/dagRuns/~/taskInstances/list:
    post:
      description: 'List task instances from all DAGs and DAG runs.

        This endpoint is a POST to allow filtering across a large number of DAG IDs, where as a GET it would run in to maximum HTTP request URL length limits.'
      operationId: get_task_instances_batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListTaskInstanceForm'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstanceCollection'
          description: Success.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Apache Airflow List Task Instances (batch)
      tags:
      - Task Instance
      x-openapi-router-controller: airflow.api_connexion.endpoints.task_instance_endpoint
components:
  schemas:
    TaskInstanceReference:
      properties:
        dag_id:
          description: The DAG ID.
          readOnly: true
          type: string
        dag_run_id:
          description: The DAG run ID.
          readOnly: true
          type: string
        execution_date:
          format: datetime
          readOnly: true
          type: string
        task_id:
          description: The task ID.
          readOnly: true
          type: string
      type: object
    ExtraLinkCollection:
      description: The collection of extra links.
      properties:
        extra_links:
          items:
            $ref: '#/components/schemas/ExtraLink'
          type: array
      type: object
    Trigger:
      properties:
        classpath:
          type: string
        created_date:
          format: datetime
          type: string
        id:
          type: integer
        kwargs:
          type: string
        triggerer_id:
          type:
          - integer
          - 'null'
      type: object
    ClassReference:
      description: Class reference
      properties:
        class_name:
          readOnly: true
          type: string
        module_path:
          readOnly: true
          type: string
      type: object
    Error:
      description: '[RFC7807](https://tools.ietf.org/html/rfc7807) compliant response.

        '
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
        instance:
          description: 'A URI reference that identifies the specific occurrence of the problem. It may or may

            not yield further information if dereferenced.

            '
          type: string
        status:
          description: The HTTP status code generated by the API server for this occurrence of the problem.
          type: number
        title:
          description: A short, human-readable summary of the problem type.
          type: string
        type:
          description: 'A URI reference [RFC3986] that identifies the problem type. This specification

            encourages that, when dereferenced, it provide human-readable documentation for

            the problem type.

            '
          type: string
      required:
      - type
      - title
      - status
      type: object
    Job:
      properties:
        dag_id:
          type:
          - string
          - 'null'
        end_date:
          format: datetime
          type:
          - string
          - 'null'
        executor_class:
          type:
          - string
          - 'null'
        hostname:
          type:
          - string
          - 'null'
        id:
          type: integer
        job_type:
          type:
          - string
          - 'null'
        latest_heartbeat:
          format: datetime
          type:
          - string
          - 'null'
        start_date:
          format: datetime
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        unixname:
          type:
          - string
          - 'null'
      type: object
    UpdateTaskInstance:
      properties:
        dry_run:
          default: false
          description: 'If set, don''t actually run this operation. The response will contain the task instance

            planned to be affected, but won''t be modified in any way.

            '
          type: boolean
        new_state:
          description: Expected new state.
          enum:
          - success
          - failed
          type: string
      type: object
    TaskInstance:
      properties:
        dag_id:
          type: string
        dag_run_id:
          description: 'The DagRun ID for this task instance


            *New in version 2.3.0*

            '
          type: string
        duration:
          type:
          - number
          - 'null'
        end_date:
          format: datetime
          type:
          - string
          - 'null'
        execution_date:
          format: datetime
          type: string
        executor_config:
          type: string
        hostname:
          type: string
        map_index:
          type: integer
        max_tries:
          type: integer
        note:
          description: 'Contains manually entered notes by the user about the TaskInstance.


            *New in version 2.5.0*

            '
          type:
          - string
          - 'null'
        operator:
          description: '*Changed in version 2.1.1*&#58; Field becomes nullable.

            '
          type:
          - string
          - 'null'
        pid:
          type:
          - integer
          - 'null'
        pool:
          type: string
        pool_slots:
          type: integer
        priority_weight:
          type:
          - integer
          - 'null'
        queue:
          type:
          - string
          - 'null'
        queued_when:
          type:
          - string
          - 'null'
        rendered_fields:
          description: 'JSON object describing rendered fields.


            *New in version 2.3.0*

            '
          type: object
        sla_miss:
          $ref: '#/components/schemas/SLAMiss'
        start_date:
          format: datetime
          type:
          - string
          - 'null'
        state:
          $ref: '#/components/schemas/TaskState'
        task_id:
          type: string
        trigger:
          $ref: '#/components/schemas/Trigger'
        triggerer_job:
          $ref: '#/components/schemas/Job'
        try_number:
          type: integer
        unixname:
          type: string
      type: object
    SLAMiss:
      properties:
        dag_id:
          description: The DAG ID.
          type: string
        description:
          type:
          - string
          - 'null'
        email_sent:
          type: boolean
        execution_date:
          format: datetime
          type: string
        notification_sent:
          type: boolean
        task_id:
          description: The task ID.
          readOnly: true
          type: string
        timestamp:
          format: datetime
          type: string
      type:
      - object
      - 'null'
    SetTaskInstanceNote:
      properties:
        note:
          description: The custom note to set for this Task Instance.
          type: string
      required:
      - note
      type: object
    CollectionInfo:
      description: Metadata about collection.
      properties:
        total_entries:
          description: 'Count of total objects in the current result set before pagination parameters

            (limit, offset) are applied.

            '
          type: integer
      type: object
    TaskInstanceCollection:
      allOf:
      - properties:
          task_instances:
            items:
              $ref: '#/components/schemas/TaskInstance'
            type: array
        type: object
      - $ref: '#/components/schemas/CollectionInfo'
      description: 'Collection of task instances.


        *Changed in version 2.1.0*&#58; ''total_entries'' field is added.

        '
      type: object
    ListTaskInstanceForm:
      properties:
        dag_ids:
          description: 'Return objects with specific DAG IDs.

            The value can be repeated to retrieve multiple matching values (OR condition).'
          items:
            type: string
          type: array
        duration_gte:
          description: 'Returns objects greater than or equal to the specified values.


            This can be combined with duration_lte parameter to receive only the selected period.

            '
          type: number
        duration_lte:
          description: 'Returns objects less than or equal to the specified values.


            This can be combined with duration_gte parameter to receive only the selected range.

            '
          type: number
        end_date_gte:
          description: 'Returns objects greater or equal the specified date.


            This can be combined with start_date_lte parameter to receive only the selected period.

            '
          format: date-time
          type: string
        end_date_lte:
          description: 'Returns objects less than or equal to the specified date.


            This can be combined with start_date_gte parameter to receive only the selected period.

            '
          format: date-time
          type: string
        execution_date_gte:
          description: 'Returns objects greater or equal to the specified date.


            This can be combined with execution_date_lte parameter to receive only the selected period.

            '
          format: date-time
          type: string
        execution_date_lte:
          description: 'Returns objects less than or equal to the specified date.


            This can be combined with execution_date_gte parameter to receive only the selected period.

            '
          format: date-time
          type: string
        pool:
          description: The value can be repeated to retrieve multiple matching values (OR condition).
          items:
            type: string
          type: array
        queue:
          description: The value can be repeated to retrieve multiple matching values (OR condition).
          items:
            type: string
          type: array
        start_date_gte:
          description: 'Returns objects greater or equal the specified date.


            This can be combined with start_date_lte parameter to receive only the selected period.

            '
          format: date-time
          type: string
        start_date_lte:
          description: 'Returns objects less or equal the specified date.


            This can be combined with start_date_gte parameter to receive only the selected period.

            '
          format: date-time
          type: string
        state:
          description: The value can be repeated to retrieve multiple matching values (OR condition).
          items:
            $ref: '#/components/schemas/TaskState'
          type: array
      type: object
    ExtraLink:
      description: Additional links containing additional information about the task.
      properties:
        class_ref:
          $ref: '#/components/schemas/ClassReference'
        href:
          readOnly: true
          type: string
        name:
          readOnly: true
          type: string
      type: object
    TaskState:
      description: 'Task state.


        *Changed in version 2.0.2*&#58; ''removed'' is added as a possible value.


        *Changed in version 2.2.0*&#58; ''deferred'' is added as a possible value.


        *Changed in version 2.4.0*&#58; ''sensing'' state has been removed.

        *Changed in version 2.4.2*&#58; ''restarting'' is added as a possible value

        '
      enum:
      - success
      - running
      - failed
      - upstream_failed
      - skipped
      - up_for_retry
      - up_for_reschedule
      - queued
      - none
      - scheduled
      - deferred
      - removed
      - restarting
      type: string
  parameters:
    DAGID:
      description: The DAG ID.
      in: path
      name: dag_id
      required: true
      schema:
        type: string
    FilterDurationGTE:
      description: 'Returns objects greater than or equal to the specified values.


        This can be combined with duration_lte parameter to receive only the selected period.

        '
      in: query
      name: duration_gte
      required: false
      schema:
        type: number
    PageOffset:
      description: The number of items to skip before starting to collect the result set.
      in: query
      name: offset
      required: false
      schema:
        minimum: 0
        type: integer
    FilterPool:
      description: The value can be repeated to retrieve multiple matching values (OR condition).
      in: query
      name: pool
      required: false
      schema:
        items:
          type: string
        type: array
    PageLimit:
      description: The numbers of items to return.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        type: integer
    FilterExecutionDateLTE:
      description: 'Returns objects less than or equal to the specified date.


        This can be combined with execution_date_gte parameter to receive only the selected period.

        '
      in: query
      name: execution_date_lte
      required: false
      schema:
        format: date-time
        type: string
    TaskTryNumber:
      description: The task try number.
      in: path
      name: task_try_number
      required: true
      schema:
        type: integer
    FilterEndDateGTE:
      description: 'Returns objects greater or equal the specified date.


        This can be combined with start_date_lte parameter to receive only the selected period.

        '
      in: query
      name: end_date_gte
      required: false
      schema:
        format: date-time
        type: string
    FilterStartDateGTE:
      description: 'Returns objects greater or equal the specified date.


        This can be combined with start_date_lte parameter to receive only the selected period.

        '
      in: query
      name: start_date_gte
      required: false
      schema:
        format: date-time
        type: string
    OrderBy:
      description: 'The name of the field to order the results by.

        Prefix a field name with `-` to reverse the sort order.


        *New in version 2.1.0*

        '
      in: query
      name: order_by
      required: false
      schema:
        type: string
    FilterDurationLTE:
