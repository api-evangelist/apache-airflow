naftiko: 1.0.0-alpha2
info:
  label: Airflow API (Stable) — Variable
  description: 'Airflow API (Stable) — Variable. 5 operations. Lead operation: Apache Airflow List Variables. Self-contained
    Naftiko capability covering one Apache Airflow business surface.'
  tags:
  - Apache Airflow
  - Variable
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_AIRFLOW_API_KEY: APACHE_AIRFLOW_API_KEY
capability:
  consumes:
  - type: http
    namespace: apache-airflow-variable
    baseUri: ''
    description: Airflow API (Stable) — Variable business capability. Self-contained, no shared references.
    resources:
    - name: variables
      path: /variables
      operations:
      - name: getvariables
        method: GET
        description: Apache Airflow List Variables
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postvariables
        method: POST
        description: Apache Airflow Create a Variable
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: variables-variable_key
      path: /variables/{variable_key}
      operations:
      - name: deletevariable
        method: DELETE
        description: Apache Airflow Delete a Variable
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getvariable
        method: GET
        description: Apache Airflow Get a Variable
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchvariable
        method: PATCH
        description: Apache Airflow Update a Variable
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.APACHE_AIRFLOW_USER}}'
      password: '{{env.APACHE_AIRFLOW_PASS}}'
  exposes:
  - type: rest
    namespace: apache-airflow-variable-rest
    port: 8080
    description: REST adapter for Airflow API (Stable) — Variable. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/variables
      name: variables
      description: REST surface for variables.
      operations:
      - method: GET
        name: getvariables
        description: Apache Airflow List Variables
        call: apache-airflow-variable.getvariables
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postvariables
        description: Apache Airflow Create a Variable
        call: apache-airflow-variable.postvariables
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/variables/{variable-key}
      name: variables-variable-key
      description: REST surface for variables-variable_key.
      operations:
      - method: DELETE
        name: deletevariable
        description: Apache Airflow Delete a Variable
        call: apache-airflow-variable.deletevariable
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getvariable
        description: Apache Airflow Get a Variable
        call: apache-airflow-variable.getvariable
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patchvariable
        description: Apache Airflow Update a Variable
        call: apache-airflow-variable.patchvariable
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-airflow-variable-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airflow API (Stable) — Variable. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: apache-airflow-list-variables
      description: Apache Airflow List Variables
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-airflow-variable.getvariables
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-create-variable
      description: Apache Airflow Create a Variable
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apache-airflow-variable.postvariables
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-delete-variable
      description: Apache Airflow Delete a Variable
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: apache-airflow-variable.deletevariable
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-get-variable
      description: Apache Airflow Get a Variable
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-airflow-variable.getvariable
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-update-variable
      description: Apache Airflow Update a Variable
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: apache-airflow-variable.patchvariable
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
