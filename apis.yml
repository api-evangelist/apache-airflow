aid: apache-airflow
name: Apache Airflow
description: Apache Airflow is an open-source platform to programmatically author, schedule, and monitor workflows, developed
  by the Apache Software Foundation. It allows you to define workflows as Directed Acyclic Graphs (DAGs) in Python code, making
  them maintainable, versionable, testable, and collaborative. Airflow provides a stable REST API for managing DAGs, DAG runs,
  tasks, connections, variables, pools, and users, along with a web-based UI for monitoring and managing pipeline execution.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://airflow.apache.org/images/feature-image.png
