              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v2/dags/{dag_id}/dagRuns/{dag_run_id}/wait:
    get:
      tags:
      - DAG Run
      summary: 'Airflow Experimental: Wait for a Dag Run to Complete, and Return Task Results…'
      description: 🚧 This is an experimental endpoint and may change or be removed without notice.Successful response are streamed as newline-delimited JSON (NDJSON). Each line is a JSON object representing the DAG run state.
      operationId: wait_dag_run_until_finished
      security:
      - OAuth2PasswordBearer: []
      - HTTPBearer: []
      parameters:
      - name: dag_id
        in: path
        required: true
        schema:
          type: string
          title: Dag Id
      - name: dag_run_id
        in: path
        required: true
        schema:
          type: string
          title: Dag Run Id
      - name: interval
        in: query
        required: true
        schema:
          type: number
          exclusiveMinimum: 0.0
          description: Seconds to wait between dag run state checks
          title: Interval
        description: Seconds to wait between dag run state checks
      - name: result
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Collect result XCom from task. Can be set multiple times.
          title: Result
        description: Collect result XCom from task. Can be set multiple times.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            application/x-ndjson:
              schema:
                type: string
                example: '{"state": "running"}

                  {"state": "success", "results": {"op": 42}}

                  '
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPExceptionResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
