naftiko: 1.0.0-alpha2
info:
  label: Airflow API (Stable) — Role
  description: 'Airflow API (Stable) — Role. 5 operations. Lead operation: Apache Airflow List Roles. Self-contained Naftiko
    capability covering one Apache Airflow business surface.'
  tags:
  - Apache Airflow
  - Role
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_AIRFLOW_API_KEY: APACHE_AIRFLOW_API_KEY
capability:
  consumes:
  - type: http
    namespace: apache-airflow-role
    baseUri: ''
    description: Airflow API (Stable) — Role business capability. Self-contained, no shared references.
    resources:
    - name: roles
      path: /roles
      operations:
      - name: getroles
        method: GET
        description: Apache Airflow List Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postrole
        method: POST
        description: Apache Airflow Create a Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: roles-role_name
      path: /roles/{role_name}
      operations:
      - name: deleterole
        method: DELETE
        description: Apache Airflow Delete a Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getrole
        method: GET
        description: Apache Airflow Get a Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchrole
        method: PATCH
        description: Apache Airflow Update a Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.APACHE_AIRFLOW_USER}}'
      password: '{{env.APACHE_AIRFLOW_PASS}}'
  exposes:
  - type: rest
    namespace: apache-airflow-role-rest
    port: 8080
    description: REST adapter for Airflow API (Stable) — Role. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/roles
      name: roles
      description: REST surface for roles.
      operations:
      - method: GET
        name: getroles
        description: Apache Airflow List Roles
        call: apache-airflow-role.getroles
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postrole
        description: Apache Airflow Create a Role
        call: apache-airflow-role.postrole
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/roles/{role-name}
      name: roles-role-name
      description: REST surface for roles-role_name.
      operations:
      - method: DELETE
        name: deleterole
        description: Apache Airflow Delete a Role
        call: apache-airflow-role.deleterole
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getrole
        description: Apache Airflow Get a Role
        call: apache-airflow-role.getrole
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patchrole
        description: Apache Airflow Update a Role
        call: apache-airflow-role.patchrole
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-airflow-role-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airflow API (Stable) — Role. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: apache-airflow-list-roles
      description: Apache Airflow List Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-airflow-role.getroles
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-create-role
      description: Apache Airflow Create a Role
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apache-airflow-role.postrole
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-delete-role
      description: Apache Airflow Delete a Role
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: apache-airflow-role.deleterole
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-get-role
      description: Apache Airflow Get a Role
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-airflow-role.getrole
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-airflow-update-role
      description: Apache Airflow Update a Role
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: apache-airflow-role.patchrole
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
