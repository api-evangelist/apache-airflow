      title: HTTPExceptionResponse
      description: HTTPException Model used for error response.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TaskStateStoreResponse:
      properties:
        key:
          type: string
          title: Key
        value:
          $ref: '#/components/schemas/JsonValue'
        updated_at:
          type: string
          format: date-time
          title: Updated At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - key
      - value
      - updated_at
      - expires_at
      title: TaskStateStoreResponse
      description: A single task state store key/value pair with metadata.
    TaskStateStoreBody:
      properties:
        value:
          $ref: '#/components/schemas/JsonValue'
        expires_at:
          anyOf:
          - type: string
            format: date-time
