naftiko: 1.0.0-alpha2
info:
  label: Airflow API (Stable) — Config
  description: 'Airflow API (Stable) — Config. 1 operations. Lead operation: Apache Airflow Get Current Configuration. Self-contained
    Naftiko capability covering one Apache Airflow business surface.'
  tags:
  - Apache Airflow
  - Config
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_AIRFLOW_API_KEY: APACHE_AIRFLOW_API_KEY
capability:
  consumes:
  - type: http
    namespace: apache-airflow-config
    baseUri: ''
    description: Airflow API (Stable) — Config business capability. Self-contained, no shared references.
    resources:
    - name: config
      path: /config
      operations:
      - name: getconfig
        method: GET
        description: Apache Airflow Get Current Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.APACHE_AIRFLOW_USER}}'
      password: '{{env.APACHE_AIRFLOW_PASS}}'
  exposes:
  - type: rest
    namespace: apache-airflow-config-rest
    port: 8080
    description: REST adapter for Airflow API (Stable) — Config. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/config
      name: config
      description: REST surface for config.
      operations:
      - method: GET
        name: getconfig
        description: Apache Airflow Get Current Configuration
        call: apache-airflow-config.getconfig
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-airflow-config-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airflow API (Stable) — Config. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: apache-airflow-get-current-configuration
      description: Apache Airflow Get Current Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-airflow-config.getconfig
      outputParameters:
      - type: object
        mapping: $.
